[package]
name = "lgtm"
version = "0.20.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
dialoguer = { version = "0.12", default-features = false }
libc = "0.2"
serde_json = "1.0"
signal-hook = "0.3"
supports-color = "3"
termimad = "0.34"

[dev-dependencies]
tempfile = "3"
