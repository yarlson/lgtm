[package]
name = "snap-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "snap-rs"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
ratatui = { version = "0.29.0", default-features = false }
serde_json = "1.0.149"
supports-color = "3.0.2"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"
