[package]
name = "lgtm-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
dialoguer = { version = "0.12", default-features = false }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
