name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BIN_NAME: lgtm

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

  build:
    name: Build ${{ matrix.os_name }} ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: darwin
            arch: amd64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            archive_ext: tar.gz
            binary_ext: ""
          - os_name: darwin
            arch: arm64
            target: aarch64-apple-darwin
            runner: macos-14
            archive_ext: tar.gz
            binary_ext: ""
          - os_name: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            archive_ext: tar.gz
            binary_ext: ""
          - os_name: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive_ext: tar.gz
            binary_ext: ""
          - os_name: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            archive_ext: zip
            binary_ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable

      - name: Validate tag matches crate version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo pkgid --locked | sed 's/.*[#@]//')"

          if [[ "$version" != "$crate_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo package version ${crate_version}."
            exit 1
          fi

      - name: Build release binary
        run: |
          set -euo pipefail
          cargo build --release --locked --all-features --target "${{ matrix.target }}" --bin "$BIN_NAME"

      - name: Package archive
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="${BIN_NAME}-v${version}-${{ matrix.os_name }}-${{ matrix.arch }}"
          archive="${package}.${{ matrix.archive_ext }}"
          stage="${RUNNER_TEMP}/${package}"
          built_binary="target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.binary_ext }}"

          mkdir -p "$stage"
          cp "$built_binary" "$stage/${BIN_NAME}${{ matrix.binary_ext }}"

          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            archive_path="$PWD/$archive"
            (cd "$stage" && 7z a "$archive_path" "${BIN_NAME}${{ matrix.binary_ext }}")
          else
            tar -czf "$archive" -C "$stage" "$BIN_NAME"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" >"${archive}.sha256"
          else
            shasum -a 256 "$archive" >"${archive}.sha256"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            ${{ env.BIN_NAME }}-*-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.archive_ext }}
            ${{ env.BIN_NAME }}-*-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: lgtm-v*
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: lgtm-v*
          merge-multiple: true

      - name: Require Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is required to push Formula/lgtm.rb to yarlson/homebrew-tap."
            exit 1
          fi

      - name: Checkout tap repository
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/yarlson/homebrew-tap.git" tap

      - name: Update formula
        run: |
          set -euo pipefail
          scripts/update-homebrew-formula.sh \
            "tap/Formula/lgtm.rb" \
            "${GITHUB_REF_NAME#v}" \
            "$GITHUB_REPOSITORY" \
            "dist"

      - name: Commit and push formula
        run: |
          set -euo pipefail
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/lgtm.rb

          if git -C tap diff --cached --quiet; then
            echo "Formula/lgtm.rb is already up to date."
            exit 0
          fi

          branch="$(git -C tap branch --show-current)"
          git -C tap commit -m "Update lgtm to ${GITHUB_REF_NAME}"
          git -C tap push origin "HEAD:${branch}"
